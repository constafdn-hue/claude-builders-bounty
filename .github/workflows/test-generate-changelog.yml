name: Test generate-changelog

on:
  pull_request:
    paths:
      - 'generate-changelog/**'
      - '.github/workflows/test-generate-changelog.yml'
  push:
    branches: [main]
    paths:
      - 'generate-changelog/**'
      - '.github/workflows/test-generate-changelog.yml'

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run real Git history integration test
        run: bash generate-changelog/tests/test_changelog.sh
